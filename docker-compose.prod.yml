services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pyaterochka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pyaterochka}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pyaterochka} -d ${POSTGRES_DB:-pyaterochka}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-pyaterochka}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pyaterochka}?schema=public
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      BOT_TOKEN: ${BOT_TOKEN:-}
      MINIAPP_URL: ${MINIAPP_URL:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
    volumes:
      - invoices:/app/data/invoices
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  invoices:
