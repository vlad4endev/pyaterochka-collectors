services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pyaterochka
      POSTGRES_PASSWORD: pyaterochka
      POSTGRES_DB: pyaterochka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyaterochka -d pyaterochka"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
